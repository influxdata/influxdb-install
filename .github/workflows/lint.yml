name: lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        # The shebang is #!/bin/sh, so shellcheck applies its POSIX sh rules and
        # flags bashisms. Notes are excluded: the script has ~100 SC2059 hits
        # from its coloured printf output, which are not worth churning.
        run: shellcheck --severity=warning install_influxdb.sh tests/test_install_functions.sh

  tests:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the helper function tests
        # Loads each helper out of install_influxdb.sh and checks it with
        # fixed inputs; the compose check also runs "docker compose config"
        run: sh tests/test_install_functions.sh
